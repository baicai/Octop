<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指令管理</title>
<style>body{font:14px "Segoe UI",sans-serif;margin:0;color:#111827;background:#f6f7f9}main{padding:24px}h1{font-size:22px;margin:0 0 8px}p{color:#6b7280}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #d1d5db;border-radius:6px;background:white}button{cursor:pointer}button.primary{background:#e85d75;color:white;border:0}table{width:100%;border-collapse:collapse;background:white;margin-top:16px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e5e7eb;vertical-align:top}th{color:#6b7280;font-weight:500}td small{display:block;color:#6b7280}dialog{border:1px solid #ddd;border-radius:12px;width:min(480px,85vw)}label{display:block;margin:10px 0}label input:not([type=checkbox]),label select,label textarea{display:block;width:95%;margin-top:5px}#status{min-height:20px;color:#bc465e}button+button{margin-left:6px}</style>
<main><h1>指令管理</h1><p>管理本机语音触发词和操作。修改后立即应用，无需重启。</p><input id="search" placeholder="搜索指令"><button id="add" class="primary">新增指令</button><p id="status" role="status"></p><table><thead><tr><th>指令及别名</th><th>操作</th><th>启用</th><th>管理</th></tr></thead><tbody id="rows"></tbody></table></main>
<dialog id="editor"><h2 id="heading">编辑指令</h2><label>触发文字<input id="name" maxlength="100"></label><label>别名（每行一个）<textarea id="aliases" rows="3"></textarea></label><label>操作类型<select id="action"><option value="open-app">启动应用</option><option value="open-url">访问网址</option><option value="close-app">关闭窗口（测试时确认）</option></select></label><label id="app-label">目标应用<select id="app"><option value="wechat">微信</option><option value="calculator">计算器</option><option value="notepad">记事本</option><option value="browser">浏览器</option></select></label><label id="url-label" hidden>网址<input id="url" placeholder="https://"></label><label><input type="checkbox" id="enabled" checked>启用</label><p id="err" role="alert"></p><button id="save" class="primary">保存</button><button id="cancel">取消</button></dialog>
<script type="module">
import {Call} from "/wails/runtime.js";
const $=id=>document.getElementById(id),call=(name,...args)=>Call.ByName("main.App."+name,...args);
let items=[],editing=null;
const appNames={wechat:"微信",calculator:"计算器",notepad:"记事本",browser:"浏览器"};
const actionNames={"open-app":"启动应用","close-app":"关闭窗口","open-url":"访问网址"};
function status(s){$("status").textContent=s}
function syncEditor(){const url=$("action").value==="open-url";$("url-label").hidden=!url;$("app-label").hidden=url}
function edit(c){editing=c?.id??null;$("name").value=c?.name??"";$("aliases").value=(c?.aliases??[]).join("\n");$("action").value=c?.action??"open-app";$("app").value=c?.action==="open-url"?"wechat":c?.target??"wechat";$("url").value=c?.action==="open-url"?c.target:"";$("enabled").checked=c?.enabled??true;$("err").textContent="";syncEditor();$("editor").showModal()}
async function persist(next){await call("SaveMouseCommands",next);items=next;render();status("已保存")}
function button(text,run){const b=document.createElement("button");b.textContent=text;b.onclick=async()=>{try{await run()}catch(e){status(String(e))}};return b}
function render(){const body=$("rows");body.replaceChildren();for(const c of items.filter(c=>[c.name,...c.aliases].join(" ").includes($("search").value))){const tr=body.insertRow(),name=tr.insertCell();name.textContent=c.name;const alias=document.createElement("small");alias.textContent=c.aliases.join("、");name.append(alias);tr.insertCell().textContent=actionNames[c.action]+" · "+(appNames[c.target]??c.target);const enabled=tr.insertCell();const check=document.createElement("input");check.type="checkbox";check.checked=c.enabled;check.onchange=async()=>{try{await persist(items.map(x=>x.id===c.id?{...x,enabled:check.checked}:x))}catch(e){check.checked=c.enabled;status(String(e))}};enabled.append(check);const ops=tr.insertCell();ops.append(button("试听",()=>{if(!("speechSynthesis" in window))throw Error("未找到本地朗读服务");const u=new SpeechSynthesisUtterance(c.name);u.lang="zh-CN";const v=speechSynthesis.getVoices().find(v=>v.localService&&v.lang.startsWith("zh"));if(!v)throw Error("未找到本地中文语音");u.voice=v;speechSynthesis.speak(u)}),button("编辑",()=>edit(c)),button("测试",async()=>{if(c.action==="close-app"&&!confirm("确认关闭微信窗口？"))return;await call("TestMouseCommand",c.id,true);status("已发出操作")}),button("删除",async()=>{if(confirm("删除指令："+c.name+"？"))await persist(items.filter(x=>x.id!==c.id))}))}}
$("search").oninput=render;$("add").onclick=()=>edit(null);$("cancel").onclick=()=>$("editor").close();$("action").onchange=syncEditor;
$("save").onclick=async()=>{try{const c={id:editing??crypto.randomUUID(),name:$("name").value.trim(),aliases:$("aliases").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),action:$("action").value,target:$("action").value==="open-url"?$("url").value.trim():$("app").value,enabled:$("enabled").checked};await persist(editing?items.map(x=>x.id===editing?c:x):[...items,c]);$("editor").close()}catch(e){$("err").textContent=String(e)}};
try{items=(await call("ListMouseCommands"))??[];render()}catch(e){status(String(e))}
</script></html>
